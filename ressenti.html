<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon ressenti - FCF91 U15F</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="form-page">

<div class="form-container">

  <img src="logo.png" alt="Logo FC Fleury 91" class="small-logo">

  <h1>MON RESSENTI</h1>

  <form id="ressentiForm">

```
<div class="form-group">
  <label>Prénom de la joueuse</label>
  <input type="text" id="prenom" name="prenom" placeholder="Prénom" required>
</div>

<div class="form-group">
  <label>Humeur du jour</label>
  <div class="ratings" id="humeurGroup">
    <label class="option"><input type="radio" name="humeur" value="1"><div class="value">1</div><div class="legend">Très mauvaise</div></label>
    <label class="option"><input type="radio" name="humeur" value="2"><div class="value">2</div><div class="legend">Mauvaise</div></label>
    <label class="option selected"><input type="radio" name="humeur" value="3" checked><div class="value">3</div><div class="legend">Moyenne</div></label>
    <label class="option"><input type="radio" name="humeur" value="4"><div class="value">4</div><div class="legend">Bonne</div></label>
    <label class="option"><input type="radio" name="humeur" value="5"><div class="value">5</div><div class="legend">Excellente</div></label>
  </div>
</div>

<div class="form-group">
  <label>Qualité du sommeil</label>
  <div class="ratings" id="sommeilGroup">
    <label class="option"><input type="radio" name="sommeil" value="1"><div class="value">1</div><div class="legend">Très mauvais</div></label>
    <label class="option"><input type="radio" name="sommeil" value="2"><div class="value">2</div><div class="legend">Mauvais</div></label>
    <label class="option selected"><input type="radio" name="sommeil" value="3" checked><div class="value">3</div><div class="legend">Moyen</div></label>
    <label class="option"><input type="radio" name="sommeil" value="4"><div class="value">4</div><div class="legend">Bon</div></label>
    <label class="option"><input type="radio" name="sommeil" value="5"><div class="value">5</div><div class="legend">Excellent</div></label>
  </div>
</div>

<div class="form-group">
  <label>Ressenti de l'effort (RPE)</label>

  <div class="rpe-display"><span id="rpeValue">5</span> / 10</div>

  <div class="rpe-grid" id="rpeGroup">
    <label class="rpe-btn"><input type="radio" name="rpe" value="0"><span>0</span></label>
    <label class="rpe-btn"><input type="radio" name="rpe" value="1"><span>1</span></label>
    <label class="rpe-btn"><input type="radio" name="rpe" value="2"><span>2</span></label>
    <label class="rpe-btn"><input type="radio" name="rpe" value="3"><span>3</span></label>
    <label class="rpe-btn"><input type="radio" name="rpe" value="4"><span>4</span></label>
    <label class="rpe-btn selected"><input type="radio" name="rpe" value="5" checked><span>5</span></label>
    <label class="rpe-btn"><input type="radio" name="rpe" value="6"><span>6</span></label>
    <label class="rpe-btn"><input type="radio" name="rpe" value="7"><span>7</span></label>
    <label class="rpe-btn"><input type="radio" name="rpe" value="8"><span>8</span></label>
    <label class="rpe-btn"><input type="radio" name="rpe" value="9"><span>9</span></label>
    <label class="rpe-btn"><input type="radio" name="rpe" value="10"><span>10</span></label>
  </div>

  <div class="rpe-legend-bars">
    <div><span class="bar green"></span>Très facile</div>
    <div><span class="bar yellow"></span>Modéré</div>
    <div><span class="bar orange"></span>Élevé</div>
    <div><span class="bar red"></span>Très élevé</div>
  </div>
</div>

<div class="form-group">
  <label>Douleur ou gêne physique ?</label>
  <select name="douleur">
    <option>Non</option>
    <option>Oui</option>
  </select>
</div>

<div class="form-group">
  <label>Quel facteur t'a limité ?</label>
  <select name="facteur">
    <option>Mes muscles brûlaient / trop lourds</option>
    <option>Mon souffle</option>
    <option>La douleur</option>
    <option>Le manque d'énergie</option>
    <option>Le mental</option>
    <option>Autre</option>
  </select>
</div>

<button type="submit" class="btn">Envoyer</button>
```

  </form>

</div>

<script src="script.js"></script>

</body>
</html>
