<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon ressenti - FCF91 U15F</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="form-page">

<div class="form-container">

    <img src="logo.png" class="small-logo" alt="Logo">

    <h1>Mon ressenti</h1>

    <form>

        <label>Nom de la joueuse</label>
        <input type="text" placeholder="Nom">

        <label>Prénom de la joueuse</label>
        <input type="text" placeholder="Prénom">

        <div class="form-group">
  <label>Humeur du jour</label>

  <div class="rating">
    <label><input type="radio" name="humeur" value="1" required><span>1</span></label>
    <label><input type="radio" name="humeur" value="2"><span>2</span></label>
    <label><input type="radio" name="humeur" value="3"><span>3</span></label>
    <label><input type="radio" name="humeur" value="4"><span>4</span></label>
    <label><input type="radio" name="humeur" value="5"><span>5</span></label>
  </div>

  <div class="rating-legend">
    <span>Très mauvaise</span>
    <span>Mauvaise</span>
    <span>Moyenne</span>
    <span>Bonne</span>
    <span>Excellente</span>
  </div>
</div>

        <label>Qualité du sommeil</label>
        <input type="range" min="" max="5" value="3">

        <div class="form-group">
    <label for="effort">Ressenti de l'effort (RPE)</label>

    <div class="rpe-value" id="rpeValue">5 / 10</div>

    <input type="range"
           id="effort"
           name="effort"
           min="0"
           max="10"
           step="1"
           value="5"
           oninput="updateRPE(this.value)">

    <div class="rpe-scale">
        <span>0</span>
        <span>1</span>
        <span>2</span>
        <span>3</span>
        <span>4</span>
        <span>5</span>
        <span>6</span>
        <span>7</span>
        <span>8</span>
        <span>9</span>
        <span>10</span>
    </div>

    <div class="rpe-zones">
        <div class="zone green">Très facile</div>
        <div class="zone yellow">Modéré</div>
        <div class="zone orange">Élevé</div>
        <div class="zone red">Très élevé</div>
    </div>
</div>

        <label>Douleur ou gêne physique ?</label>
        <select>
            <option>Non</option>
            <option>Oui</option>
        </select>

        <label>Quel facteur t'a limité pour aller plus vite / plus loin ?</label>
        <select>
            <option>Mes muscles brûlaient / trop lourds</option>
            <option>Trop essoufflée / mon coeur battait trop vite</option>
            <option>Les deux de manière égale</option>
            <option>Aucun</option>
        </select>

        <button type="submit" class="btn">Envoyer</button>

    </form>
