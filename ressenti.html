<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050505">

  <title>Mon ressenti — FCF91 U15F</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS réservé uniquement à la page Ressenti -->
  <link rel="stylesheet" href="ressenti.css?v=4">
</head>

<body>

  <main class="ressenti-page">

    <header class="ressenti-header">

      <a href="index.html" class="back-button">
        ← Retour à l’accueil
      </a>

      <img
        src="logo.png"
        alt="Logo du FC Fleury 91"
        class="ressenti-logo"
      >

      <h1>MON RESSENTI</h1>

      <p>FCF91 U15F</p>

    </header>

    <form id="ressentiForm" class="ressenti-form">

      <!-- Prénom -->
      <section class="form-section">

        <label for="prenom" class="section-title">
          Prénom de la joueuse
        </label>

        <input
          type="text"
          id="prenom"
          name="prenom"
          class="text-input"
          placeholder="Prénom"
          autocomplete="given-name"
          required
        >

      </section>

      <!-- Humeur -->
      <section class="form-section">

        <h2 class="section-title">
          Humeur du jour
        </h2>

        <div class="rating-grid">

          <label class="rating-choice">
            <input
              type="radio"
              name="humeur"
              value="1"
              required
            >
            <span class="rating-square">1</span>
            <span class="rating-label">Très mauvaise</span>
          </label>

          <label class="rating-choice">
            <input
              type="radio"
              name="humeur"
              value="2"
            >
            <span class="rating-square">2</span>
            <span class="rating-label">Mauvaise</span>
          </label>

          <label class="rating-choice">
            <input
              type="radio"
              name="humeur"
              value="3"
              checked
            >
            <span class="rating-square">3</span>
            <span class="rating-label">Moyenne</span>
          </label>

          <label class="rating-choice">
            <input
              type="radio"
              name="humeur"
              value="4"
            >
            <span class="rating-square">4</span>
            <span class="rating-label">Bonne</span>
          </label>

          <label class="rating-choice">
            <input
              type="radio"
              name="humeur"
              value="5"
            >
            <span class="rating-square">5</span>
            <span class="rating-label">Excellente</span>
          </label>

        </div>

      </section>

      <!-- Sommeil -->
      <section class="form-section">

        <h2 class="section-title">
          Qualité du sommeil
        </h2>

        <div class="rating-grid">

          <label class="rating-choice">
            <input
              type="radio"
              name="sommeil"
              value="1"
              required
            >
            <span class="rating-square">1</span>
            <span class="rating-label">Très mauvais</span>
          </label>

          <label class="rating-choice">
            <input
              type="radio"
              name="sommeil"
              value="2"
            >
            <span class="rating-square">2</span>
            <span class="rating-label">Mauvais</span>
          </label>

          <label class="rating-choice">
            <input
              type="radio"
              name="sommeil"
              value="3"
              checked
            >
            <span class="rating-square">3</span>
            <span class="rating-label">Moyen</span>
          </label>

          <label class="rating-choice">
            <input
              type="radio"
              name="sommeil"
              value="4"
            >
            <span class="rating-square">4</span>
            <span class="rating-label">Bon</span>
          </label>

          <label class="rating-choice">
            <input
              type="radio"
              name="sommeil"
              value="5"
            >
            <span class="rating-square">5</span>
            <span class="rating-label">Excellent</span>
          </label>

        </div>

      </section>

      <!-- RPE -->
      <section class="form-section">

        <h2 class="section-title">
          Ressenti de l’effort (RPE)
        </h2>

        <div class="rpe-display">
          <span id="rpeValue">5</span>
          <span>/ 10</span>
        </div>

        <div class="rpe-grid">

          <label class="rpe-choice">
            <input type="radio" name="rpe" value="0">
            <span>0</span>
          </label>

          <label class="rpe-choice">
            <input type="radio" name="rpe" value="1">
            <span>1</span>
          </label>

          <label class="rpe-choice">
            <input type="radio" name="rpe" value="2">
            <span>2</span>
          </label>

          <label class="rpe-choice">
            <input type="radio" name="rpe" value="3">
            <span>3</span>
          </label>

          <label class="rpe-choice">
            <input type="radio" name="rpe" value="4">
            <span>4</span>
          </label>

          <label class="rpe-choice">
            <input
              type="radio"
              name="rpe"
              value="5"
              checked
              required
            >
            <span>5</span>
          </label>

          <label class="rpe-choice">
            <input type="radio" name="rpe" value="6">
            <span>6</span>
          </label>

          <label class="rpe-choice">
            <input type="radio" name="rpe" value="7">
            <span>7</span>
          </label>

          <label class="rpe-choice">
            <input type="radio" name="rpe" value="8">
            <span>8</span>
          </label>

          <label class="rpe-choice">
            <input type="radio" name="rpe" value="9">
            <span>9</span>
          </label>

          <label class="rpe-choice">
            <input type="radio" name="rpe" value="10">
            <span>10</span>
          </label>

        </div>

      </section>

      <!-- Douleur -->
      <section class="form-section">

        <label for="douleur" class="section-title">
          Douleur ou gêne physique ?
        </label>

        <select
          id="douleur"
          name="douleur"
          class="select-input"
          required
        >
          <option value="Non">Non</option>
          <option value="Oui">Oui</option>
        </select>

      </section>

      <!-- Facteur limitant -->
      <section class="form-section">

        <label for="facteur" class="section-title">
          Quel facteur t’a limitée ?
        </label>

        <select
          id="facteur"
          name="facteur"
          class="select-input"
          required
        >
          <option value="Aucun">
            Aucun
          </option>

          <option value="Muscles lourds">
            Mes muscles brûlaient ou étaient trop lourds
          </option>

          <option value="Souffle">
            Mon souffle
          </option>

          <option value="Douleur">
            Une douleur
          </option>

          <option value="Manque d’énergie">
            Le manque d’énergie
          </option>

          <option value="Mental">
            Le mental
          </option>

          <option value="Autre">
            Autre
          </option>
        </select>

      </section>

      <!-- Commentaire -->
      <section class="form-section">

        <label for="commentaire" class="section-title">
          Commentaire facultatif
        </label>

        <textarea
          id="commentaire"
          name="commentaire"
          class="text-area"
          rows="4"
          placeholder="Tu peux préciser ton ressenti ici..."
        ></textarea>

      </section>

      <button type="submit" class="submit-button">
        ENVOYER
      </button>

      <p
        id="formMessage"
        class="form-message"
        role="status"
        aria-live="polite"
      ></p>

    </form>

  </main>

  <script src="script.js?v=4"></script>

</body>

</html>
