<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050505">

  <title>Mon ressenti - FCF91 U15F</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="ressenti.css">
</head>

<body class="form-page">

  <main class="form-container">

    <header class="form-header">
      <img
        src="logo.png"
        alt="Logo du FC Fleury 91"
        class="small-logo"
      >

      <h1>MON RESSENTI</h1>

      <a href="index.html" class="back-link">
        ← Retour à l’accueil
      </a>
    </header>

    <form id="ressentiForm">

      <!-- Prénom -->
      <section class="form-group">
        <label for="prenom">Prénom de la joueuse</label>

        <input
          type="text"
          id="prenom"
          name="prenom"
          placeholder="Prénom"
          autocomplete="given-name"
          required
        >
      </section>

      <!-- Humeur -->
      <fieldset class="form-group rating-fieldset">
        <legend>Humeur du jour</legend>

        <div class="ratings" id="humeurGroup">

          <label class="option">
            <input
              type="radio"
              name="humeur"
              value="1"
              required
            >

            <span class="value">1</span>
            <span class="legend">Très mauvaise</span>
          </label>

          <label class="option">
            <input
              type="radio"
              name="humeur"
              value="2"
            >

            <span class="value">2</span>
            <span class="legend">Mauvaise</span>
          </label>

          <label class="option selected">
            <input
              type="radio"
              name="humeur"
              value="3"
              checked
            >

            <span class="value">3</span>
            <span class="legend">Moyenne</span>
          </label>

          <label class="option">
            <input
              type="radio"
              name="humeur"
              value="4"
            >

            <span class="value">4</span>
            <span class="legend">Bonne</span>
          </label>

          <label class="option">
            <input
              type="radio"
              name="humeur"
              value="5"
            >

            <span class="value">5</span>
            <span class="legend">Excellente</span>
          </label>

        </div>
      </fieldset>

      <!-- Sommeil -->
      <fieldset class="form-group rating-fieldset">
        <legend>Qualité du sommeil</legend>

        <div class="ratings" id="sommeilGroup">

          <label class="option">
            <input
              type="radio"
              name="sommeil"
              value="1"
              required
            >

            <span class="value">1</span>
            <span class="legend">Très mauvais</span>
          </label>

          <label class="option">
            <input
              type="radio"
              name="sommeil"
              value="2"
            >

            <span class="value">2</span>
            <span class="legend">Mauvais</span>
          </label>

          <label class="option selected">
            <input
              type="radio"
              name="sommeil"
              value="3"
              checked
            >

            <span class="value">3</span>
            <span class="legend">Moyen</span>
          </label>

          <label class="option">
            <input
              type="radio"
              name="sommeil"
              value="4"
            >

            <span class="value">4</span>
            <span class="legend">Bon</span>
          </label>

          <label class="option">
            <input
              type="radio"
              name="sommeil"
              value="5"
            >

            <span class="value">5</span>
            <span class="legend">Excellent</span>
          </label>

        </div>
      </fieldset>

      <!-- RPE -->
      <fieldset class="form-group rpe-section">
        <legend>Ressenti de l’effort (RPE)</legend>

        <div class="rpe-display">
          <span id="rpeValue">5</span>
          <span class="rpe-total">/ 10</span>
        </div>

        <div class="rpe-grid" id="rpeGroup">

          <label class="rpe-btn">
            <input type="radio" name="rpe" value="0">
            <span>0</span>
          </label>

          <label class="rpe-btn">
            <input type="radio" name="rpe" value="1">
            <span>1</span>
          </label>

          <label class="rpe-btn">
            <input type="radio" name="rpe" value="2">
            <span>2</span>
          </label>

          <label class="rpe-btn">
            <input type="radio" name="rpe" value="3">
            <span>3</span>
          </label>

          <label class="rpe-btn">
            <input type="radio" name="rpe" value="4">
            <span>4</span>
          </label>

          <label class="rpe-btn selected">
            <input
              type="radio"
              name="rpe"
              value="5"
              checked
              required
            >

            <span>5</span>
          </label>

          <label class="rpe-btn">
            <input type="radio" name="rpe" value="6">
            <span>6</span>
          </label>

          <label class="rpe-btn">
            <input type="radio" name="rpe" value="7">
            <span>7</span>
          </label>

          <label class="rpe-btn">
            <input type="radio" name="rpe" value="8">
            <span>8</span>
          </label>

          <label class="rpe-btn">
            <input type="radio" name="rpe" value="9">
            <span>9</span>
          </label>

          <label class="rpe-btn">
            <input type="radio" name="rpe" value="10">
            <span>10</span>
          </label>

        </div>
      </fieldset>

      <!-- Douleur -->
      <section class="form-group">
        <label for="douleur">
          Douleur ou gêne physique ?
        </label>

        <select id="douleur" name="douleur" required>
          <option value="Non">Non</option>
          <option value="Oui">Oui</option>
        </select>
      </section>

      <!-- Facteur limitant -->
      <section class="form-group">
        <label for="facteur">
          Quel facteur t’a limitée ?
        </label>

        <select id="facteur" name="facteur" required>
          <option value="Aucun">
            Aucun
          </option>

          <option value="Muscles lourds">
            Mes muscles brûlaient ou étaient trop lourds
          </option>

          <option value="Souffle">
            Mon souffle
          </option>

          <option value="Douleur">
            Une douleur
          </option>

          <option value="Manque d'énergie">
            Le manque d’énergie
          </option>

          <option value="Mental">
            Le mental
          </option>

          <option value="Autre">
            Autre
          </option>
        </select>
      </section>

      <!-- Commentaire -->
      <section class="form-group">
        <label for="commentaire">
          Commentaire facultatif
        </label>

        <textarea
          id="commentaire"
          name="commentaire"
          rows="4"
          placeholder="Tu peux préciser ton ressenti ici..."
        ></textarea>
      </section>

      <button type="submit" class="btn submit-btn">
        ENVOYER
      </button>

      <p
        id="formMessage"
        class="form-message"
        role="status"
        aria-live="polite"
      ></p>

    </form>

  </main>

  <script src="script.js"></script>

</body>
</html>
